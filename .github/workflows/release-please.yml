name: Release Please

# Runs on every push to dev: inspects commits since the last release and keeps a
# "Release PR" up to date with the next version bump + changelog. Merging that PR
# is what actually creates the tag and the GitHub Release.
on:
  push:
    branches: [dev]

# release-please needs to open/update PRs and push tags on our behalf.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # No Xcode/Firebase involved here, just file/git manipulation, so a cheaper Linux
    # runner is enough (unlike the CI workflow, which needs a real Mac to build iOS).
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: dev
